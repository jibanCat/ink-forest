<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ink Forest</title>
<meta name="description" content="Ink Forest: an interactive Lyα tomography game. Observe Lyα forest sightlines, infer the structure between them, and revise the map as new evidence arrives.">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#7a7874;overflow:hidden;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:fixed;left:50%;transform:translateX(-50%);top:16px;max-width:min(760px,calc(100vw - 380px));text-align:center;color:#f3f0ea;font-size:15px;line-height:1.35;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 1px 3px rgba(0,0,0,.45)}
#tag{position:fixed;left:10px;right:10px;bottom:8px;color:rgba(240,236,228,.62);font:11px Helvetica,Arial,sans-serif;pointer-events:none}
#hud-drops{position:fixed;right:16px;top:16px;display:flex;gap:7px;pointer-events:none}
#hud-gold{position:fixed;left:16px;top:14px;display:flex;align-items:center;gap:7px;pointer-events:none;font:700 24px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;color:#fdf3d4;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#hud-gold .n{display:inline-block;min-width:.6em;transform-origin:30% 55%}#hud-gold .gg{display:flex;align-items:center;gap:6px;margin-left:12px;visibility:hidden}
#hud-gold .plus{position:absolute;left:36px;top:32px;font:700 17px 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#ffe39a;opacity:0}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff7d6 0,#f6d062 24%,#d99b1e 60%,#8b5a0b 100%);box-shadow:inset 0 0 0 2px rgba(122,76,6,.6),inset 0 0 0 4.5px rgba(255,232,150,.45),0 2px 5px rgba(0,0,0,.35)}
.gem{display:inline-block;width:24px;height:22px;flex:none;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.30))}
#rules{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(36,34,32,.40);z-index:5}
#rules .card{width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;padding:22px 24px 18px;background:rgba(246,243,236,.97);color:#1d1d1f;border-radius:8px;box-shadow:0 10px 36px rgba(0,0,0,.35);font-size:15px;line-height:1.45}
#rules h1{font-size:25px;font-weight:normal;letter-spacing:.03em;margin:0 0 2px}#rules .sub{font:italic 14px Georgia,serif;color:#666;margin:0 0 14px}
#rules .goal{margin:0 0 14px}#rules ol{margin:0 0 12px;padding:0;list-style:none;counter-reset:s}#rules li{position:relative;padding-left:31px;margin:0 0 9px;counter-increment:s}
#rules li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:#2a2a2c;color:#f3f0ea;font:12px/21px Helvetica,Arial,sans-serif;text-align:center}
#rules .end{font-size:13.5px;color:#444;margin:0 0 16px}#rules .ic.coin{width:16px;height:16px;vertical-align:-3px}#rules .ic.gem{width:17px;height:16px;vertical-align:-3px;filter:none}
#rules button{display:block;margin:0 auto;font:15px Georgia,serif;letter-spacing:.06em;padding:10px 34px;border:0;border-radius:4px;background:#2a2a2c;color:#f3f0ea;cursor:pointer}
#deb .score{display:flex;align-items:center;gap:9px;font:700 26px/1.1 'Helvetica Neue',Helvetica,Arial,sans-serif;margin:0 0 4px}#deb .score .coin{width:26px;height:26px}#deb .score small{font:13px Helvetica,Arial,sans-serif;color:#555;margin-left:4px}
#deb .res{font-size:14px;margin:0 0 10px}#deb .res b{font:700 15px 'Helvetica Neue',Helvetica,Arial,sans-serif}
#deb{display:none;position:fixed;left:16px;bottom:30px;max-width:380px;padding:14px 16px 12px;background:rgba(246,243,236,.94);color:#1d1d1f;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.28);font-size:14px;line-height:1.4}
#deb h2{font-size:16px;margin:0 0 8px;font-weight:normal}#deb p{margin:0 0 7px}#deb p.s{font-size:12.5px;color:#444}
#deb .b{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#deb button,#notes{font:12px Helvetica,Arial,sans-serif;padding:6px 10px;border:1px solid #888;border-radius:4px;background:#fbfaf6;color:#222;cursor:pointer}
#deb button.on{background:#2a2a2c;color:#f3f0ea;border-color:#2a2a2c}
#notes{display:none;position:fixed;left:16px;bottom:30px}
@media (max-width:640px),(max-height:520px){#tag{display:none}}
@media (max-width:640px){#msg{top:54px;font-size:13.5px;max-width:92vw}#tag{font-size:9.5px}#deb{left:8px;right:8px;bottom:24px;max-width:none;max-height:48vh;overflow:auto;font-size:13px}#hud-gold{left:12px;top:12px;font-size:20px}#hud-gold .coin{width:22px;height:22px}#hud-gold .gem{width:19px;height:17px}#hud-gold .plus{left:28px;top:27px}}
@media (max-height:520px){#rules .card{padding:14px 18px 12px;font-size:13.5px;line-height:1.38}#rules h1{font-size:20px}#rules .sub{margin-bottom:8px}#rules .goal{margin-bottom:8px}#rules li{margin-bottom:5px}#rules .end{margin-bottom:10px}}
</style></head><body>
<canvas id="c"></canvas><div id="msg"></div><div id="tag"></div><div id="deb"></div><button id="notes">Map notes</button><div id="rules"></div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center;color:#f3f0ea">Ink Forest needs JavaScript and WebGL2.</p></noscript>
<script src="assets/ink-forest-data.js"></script>
<script>
(function(){if(!window.SHEETDATA){var m=document.getElementById('msg');m.textContent='The data file for this build is not included (assets/ink-forest-data.js). See DATA.md in the source repository.';m.style.opacity=1;return;}
 var s=document.createElement('script');s.src='assets/ink-forest.js';document.body.appendChild(s);})();
</script>
</body></html>
